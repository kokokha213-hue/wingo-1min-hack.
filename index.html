<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Synaptic — Live</title>
<style>body{font-family:Arial;background:#020204;color:#dff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.container{width:920px;max-width:96vw;padding:18px;background:linear-gradient(180deg,#051426,#07121a);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.7)}
textarea{width:100%;height:84px;background:#001018;color:#0f0;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);font-family:monospace}
button{padding:10px 14px;margin-right:8px;border-radius:8px;border:none;background:#00ff99;color:#002;font-weight:700;cursor:pointer}
pre{background:#001018;padding:12px;border-radius:8px;color:#0f0;min-height:240px;overflow:auto;white-space:pre-wrap;font-family:monospace}
.controls{display:flex;align-items:center;margin-top:10px}
.small{font-size:13px;color:#88a}</style></head>
<body>
<div class="container">
  <h2>Cosmic Synaptic Predictor — Live (Backend Demo)</h2>
  <div class="small">Paste last 10 results (comma sep)</div>
  <textarea id="input">3,3,8,2,3,9,0,3,7,5</textarea>
  <div class="controls">
    <button id="predict">Predict Now (POST /predict)</button>
    <button id="next">Next Prediction</button>
    <button id="reset">Reset</button>
    <div style="flex:1"></div>
    <div class="small">Backend: Flask — Ready for Render/Railway</div>
  </div>
  <pre id="out">(prediction output)</pre>
</div>
<script>
function parseInput(s){return s.split(',').map(x=>parseInt(x)).filter(n=>!isNaN(n)).slice(0,10);}
let lastGenerated=null;
let lastResultState={last_10_results:[3,3,8,2,3,9,0,3,7,5], last_result:'N/A'};

async function callPredict(payload){
  try{
    const res = await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j = await res.json();
    return j;
  }catch(e){return {error: e.toString()};}
}

document.getElementById('predict').addEventListener('click', async ()=>{
  const arr = parseInput(document.getElementById('input').value);
  const resp = await callPredict({last_10_results: arr});
  document.getElementById('out').textContent = JSON.stringify(resp,null,2);
  if(resp && resp.prediction){ lastGenerated = resp.prediction.number; lastResultState = resp.ai_memory_state; }
});

document.getElementById('next').addEventListener('click', async ()=>{
  // slide window using lastGenerated if available
  let arr = parseInput(document.getElementById('input').value);
  if(lastGenerated!==null){ arr = arr.slice(1); arr.push(lastGenerated); document.getElementById('input').value = arr.join(','); }
  const resp = await callPredict({last_10_results: arr});
  document.getElementById('out').textContent = JSON.stringify(resp,null,2);
  if(resp && resp.prediction){ lastGenerated = resp.prediction.number; lastResultState = resp.ai_memory_state; }
});

document.getElementById('reset').addEventListener('click', ()=>{ document.getElementById('input').value='3,3,8,2,3,9,0,3,7,5'; document.getElementById('out').textContent='(prediction output)'; lastGenerated=null; });
</script>
</body></html>
